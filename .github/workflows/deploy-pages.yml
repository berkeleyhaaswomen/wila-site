# DISABLED. GitHub Pages can no longer host this site.
#
# The admin site at /admin needs a server: it uses Server Actions for sign-in
# and for saving events and spotlights, dynamic routes for /admin/events/[id],
# and an API route for photo uploads. GitHub Pages serves static files only, so
# `next build` with STATIC_EXPORT=true now fails with:
#
#     Server Actions are not supported with static export.
#
# The site is deployed on Vercel, which runs the server. See ADMIN.md step 5.
# This file is kept (rather than deleted) so the history and the Pages setup are
# easy to find if GitHub Pages is ever wanted again for a static-only variant.
#
# To re-enable you would need to drop the admin site, or split it into its own
# separately-hosted app.
#
# The automatic `push` and `repository_dispatch` triggers are removed so this
# can't fail on every push to main. `workflow_dispatch` is left in place, which
# means it only ever runs if someone deliberately presses "Run workflow", and
# it will fail until the notes above are addressed.

name: Deploy to GitHub Pages (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          STATIC_EXPORT: "true"
        run: npm run build

      # GitHub Pages doesn't serve _next paths under _* prefixes by default.
      # A .nojekyll file disables Jekyll processing so _next assets are served.
      - name: Add .nojekyll
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
